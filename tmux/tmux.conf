# The existing ~/.tmux.conf keeps its OpenRig settings and sources this file.
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal 'tmux-256color'
# Preserve Shift+Enter and other modified keys when applications request them.
set -s extended-keys on
set -s extended-keys-format csi-u
# A reserved index avoids accumulating duplicate entries on every reload.
set -s terminal-features[100] 'xterm-ghostty:RGB:extkeys'
set -g mouse on
set -g focus-follows-mouse on

# Ghostty sends these CSI sequences for its macOS pane and tab shortcuts.
# Fixed user-key indexes make reloading idempotent; Ctrl+B remains available.
set -s user-keys[100] "\e[9001~"
set -s user-keys[101] "\e[9002~"
set -s user-keys[102] "\e[9003~"
set -s user-keys[103] "\e[9004~"
set -s user-keys[104] "\e[9005~"
set -s user-keys[105] "\e[9006~"
set -s user-keys[106] "\e[9007~"
set -s user-keys[107] "\e[9008~"
set -s user-keys[108] "\e[9009~"
set -s user-keys[109] "\e[9010~"
set -s user-keys[110] "\e[9011~"
set -s user-keys[111] "\e[9012~"
set -s user-keys[112] "\e[9013~"
set -s user-keys[113] "\e[9014~"
set -s user-keys[114] "\e[9015~"
set -s user-keys[115] "\e[9016~"
set -s user-keys[116] "\e[9017~"
set -s user-keys[117] "\e[9018~"
set -s user-keys[118] "\e[9019~"
set -s user-keys[120] "\e[9021~"
set -s user-keys[121] "\e[9022~"
set -s user-keys[122] "\e[9023~"
set -s user-keys[123] "\e[9024~"
set -s user-keys[124] "\e[9025~"
set -s user-keys[125] "\e[9026~"
set -s user-keys[126] "\e[9027~"
set -s user-keys[127] "\e[9028~"
set -s user-keys[128] "\e[9029~"

bind -n User100 split-window -h -c '#{pane_current_path}'
bind -n User101 split-window -v -c '#{pane_current_path}'
bind -n User102 confirm-before -p 'Close pane #I.#P? (y/n)' "kill-pane -t '#{pane_id}'"
bind -n User103 select-pane -t :.-
bind -n User104 select-pane -t :.+
bind -n User105 select-pane -U
bind -n User106 select-pane -D
bind -n User107 select-pane -L
bind -n User108 select-pane -R
bind -n User109 resize-pane -U 10
bind -n User110 resize-pane -D 10
bind -n User111 resize-pane -L 10
bind -n User112 resize-pane -R 10
bind -n User113 select-layout -E
bind -n User114 resize-pane -Z
bind -n User115 new-window -c '#{pane_current_path}'
bind -n User116 previous-window
bind -n User117 next-window
bind -n User118 confirm-before -p 'Close tab #I and all its panes? (y/n)' "kill-window -t '#{window_id}'"
bind -n User120 select-window -t :1
bind -n User121 select-window -t :2
bind -n User122 select-window -t :3
bind -n User123 select-window -t :4
bind -n User124 select-window -t :5
bind -n User125 select-window -t :6
bind -n User126 select-window -t :7
bind -n User127 select-window -t :8
bind -n User128 select-window -t :$

# Remove the former menu binding when reloading an existing server.
unbind u

# Dracula palette for prompts, clock mode and window alerts.
set -g message-style 'bg=#44475a,fg=#f8f8f2,fill=#44475a'
set -g clock-mode-style 12
set -g window-status-activity-style bold
set -g window-status-bell-style bold

# Adjacent panes share one ASCII separator (|, -, +), without a title row.
setw -g pane-border-lines simple
setw -g pane-border-status off
# Point into the active pane instead of half-colouring a shared two-pane border.
setw -g pane-border-indicators arrows
# Muted inactive borders keep the active border and its native markers visible.
setw -g pane-border-style 'fg=#44475a'
setw -g pane-active-border-style 'fg=#bd93f9'

# Display native clickable tabs in one top status row.
set -gu status-format
set -g status on
# Refresh the status row every 5 seconds.
set -g status-interval 5
set -g status-position top
set -g status-justify left
set -g status-style 'bg=#343746,fg=#b0b0bd'
set -g status-left-length 0
set -g status-left ''
set -g window-status-style 'fg=#b0b0bd,bg=#343746'
set -g window-status-current-style 'fg=#bd93f9,bg=#44475a,bold'
set -g window-status-format '[#I:#W]'
set -g window-status-current-format '[#I:#W]'
set -g window-status-separator ' '

set -g status-right ''
